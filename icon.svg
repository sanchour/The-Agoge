<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E0B5"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8232"/>
    </linearGradient>
  </defs>
  
  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#iconBg)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Abstract Spartan Lambda Theme Icon -->
  <g transform="translate(256, 256)">
    <!-- Outer Focus Ring Segment -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#goldSheen)" stroke-width="6" opacity="0.3" stroke-dasharray="140 30 60 30"/>
    
    <!-- Monolithic Geometric Lambda (Λ) Chevron -->
    <!-- Left Leg -->
    <path d="M-20 -115 L-95 110 L-50 110 L0 -35 L-20 -115 Z" fill="url(#goldSheen)"/>
    <!-- Right Leg -->
    <path d="M20 -115 L95 110 L50 110 L0 -35 L20 -115 Z" fill="url(#goldSheen)"/>
    
    <!-- Center Core Point -->
    <polygon points="0,-125 -16,-85 16,-85" fill="url(#goldSheen)"/>
    
    <!-- Horizontal Cross-Bar Accent (Minimalist Discipline Horizon) -->
    <line x1="-36" y1="42" x2="36" y2="42" stroke="url(#goldSheen)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
